name: tictacverse
version: 1.14.0+31
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  google_mobile_ads: ^7.0.0
  audioplayers: ^6.0.0
  shared_preferences: ^2.3.2
  in_app_review: ^2.0.9
  in_app_update: ^4.2.3
  url_launcher: ^6.3.0
  games_services: ^5.1.0
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.3
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/symbols/board/
    - assets/symbols/x/
    - assets/symbols/o/
    - assets/audio/sfx/
    - assets/audio/music/
  generate: true
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path_android: "assets/icon/app_icon.png"
  # Camadas geradas por tool/icon/render_icon.mjs a partir de tool/icon/icon.svg.
  adaptive_icon_background: "assets/icon/icon_bg.png"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"

flutter_native_splash:
  android: true
  ios: false

  color: "#1A0B2E"
  image: assets/icon/app_icon.png

  android_12:
    color: "#1A0B2E"
    image: assets/icon/app_icon.png
